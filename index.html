<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>兼职任务查询</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f5f7;
      --panel: #ffffff;
      --line: #dfe3e8;
      --text: #17202a;
      --muted: #667085;
      --brand: #1769e0;
      --brand-soft: #eaf2ff;
      --ok: #12805c;
      --ok-soft: #e8f6f0;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    main {
      width: min(760px, calc(100% - 28px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    .top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 700;
    }

    .subtitle {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .snapshot {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      line-height: 1.35;
      text-align: right;
    }

    .search {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 18px;
    }

    .claim {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 18px;
    }

    .claim h2 {
      margin: 0 0 6px;
      font-size: 18px;
    }

    .claim-fields {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .claim-tasks {
      margin-top: 14px;
    }

    .claim-groups {
      display: grid;
      gap: 14px;
      margin-top: 14px;
    }

    .claim-group {
      border: 1px solid #edf0f3;
      border-radius: 8px;
      padding: 12px;
      background: #fafbfc;
    }

    .claim-group-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 4px;
    }

    .claim-group-title {
      font-weight: 700;
    }

    .claim-group-count {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .claim-group-list {
      max-height: 220px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .claim-task {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px;
      align-items: start;
      padding: 11px 0;
      border-top: 1px solid #edf0f3;
    }

    .claim-task input {
      width: 18px;
      height: 18px;
      margin-top: 3px;
      flex: 0 0 auto;
    }

    .claim-task.is-disabled {
      opacity: .45;
    }

    .claim-task-title {
      font-weight: 700;
      line-height: 1.4;
    }

    .claim-task-meta {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
      line-height: 1.5;
    }

    .claim-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
    }

    .claim-fields .primary[hidden] {
      display: none;
    }

    .claim-message {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .claim-message.error { color: #b42318; }
    .claim-message.success { color: var(--ok); }

    .search-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    input {
      flex: 1;
      min-width: 0;
      height: 44px;
      border: 1px solid #c9d1d9;
      border-radius: 8px;
      padding: 0 12px;
      font-size: 15px;
      color: var(--text);
      background: #fff;
      outline: none;
    }

    input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(23, 105, 224, .12);
    }

    button {
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: background .16s ease, transform .08s ease;
    }

    button:active { transform: translateY(1px); }

    .primary {
      height: 44px;
      padding: 0 18px;
      background: var(--brand);
      color: #fff;
      font-size: 15px;
    }

    .primary:hover { background: #1159c2; }

    .ghost {
      height: 34px;
      padding: 0 12px;
      background: #fff;
      color: var(--brand);
      border: 1px solid #b9cff5;
      font-size: 13px;
    }

    .ghost:hover { background: var(--brand-soft); }

    .hint {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .result-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 2px 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .person {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      height: 24px;
      border-radius: 999px;
      padding: 0 9px;
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 12px;
      font-weight: 700;
    }

    .task {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .task-title {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .task-name {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.4;
    }

    .status {
      flex: 0 0 auto;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      background: #f0f2f5;
      color: var(--muted);
    }

    .status.ok {
      background: var(--ok-soft);
      color: var(--ok);
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 10px;
    }

    .field {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 10px;
      align-items: start;
      margin-top: 10px;
      font-size: 14px;
      line-height: 1.55;
    }

    .field-label {
      color: var(--muted);
      font-size: 13px;
      padding-top: 5px;
    }

    .field-value {
      min-width: 0;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      border: 1px solid #edf0f3;
      background: #fafbfc;
      border-radius: 7px;
      padding: 9px 10px;
    }

    .copy-line {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .copy-line .field-value {
      flex: 1;
    }

    .empty {
      border: 1px dashed #c8d0d8;
      border-radius: 8px;
      background: #fafbfc;
      color: var(--muted);
      text-align: center;
      padding: 32px 16px;
      font-size: 14px;
    }

    @media (max-width: 560px) {
      main { padding-top: 22px; }
      .top { display: block; }
      .snapshot { text-align: left; margin-top: 12px; }
      .search-row { flex-wrap: wrap; }
      .primary { width: 100%; }
      .claim-fields { grid-template-columns: 1fr; }
      .claim-fields .primary { width: 100%; }
      .field { grid-template-columns: 1fr; gap: 3px; }
      .field-label { padding-top: 0; }
      .task-title { display: block; }
      .status { display: inline-block; margin-top: 8px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <div>
        <h1>兼职任务查询</h1>
        <p class="subtitle">选择一个入口开始。</p>
      </div>
      <div class="snapshot">数据快照<br>2026-09-03</div>
    </div>

    <section class="claim">
      <h2>认领任务</h2>
      <p class="hint">输入自己的姓名后，查看并选择可认领任务。</p>
      <div class="claim-fields">
        <input id="claimName" type="text" placeholder="真实姓名" autocomplete="name">
        <button class="primary" id="loadAvailableBtn" type="button" hidden>查看可认领任务</button>
      </div>
      <div id="claimTasks" class="claim-tasks"></div>
      <div class="claim-actions" id="claimActions" hidden>
        <button class="primary" id="claimBtn" type="button">确认认领</button>
        <span id="claimMessage" class="claim-message"></span>
      </div>
    </section>

    <section class="search">
      <h2>查询自己的任务详情</h2>
      <div class="search-row">
        <input id="query" type="search" placeholder="输入姓名" autocomplete="name">
        <button class="primary" id="searchBtn" type="button">查询</button>
        <button class="ghost" id="resetBtn" type="button">清空</button>
      </div>
      <p class="hint">用于查看已经认领的任务详情。</p>
    </section>

    <div class="result-head">
      <span id="resultLabel">等待查询</span>
      <span id="taskCount"></span>
    </div>
    <div id="results"></div>
  </main>

  <script>
    let people = [];
    let availableTasks = [];
    const apiBase = "https://odourless-demetra-cany.ngrok-free.dev";

    async function loadData() {
      try {
        const response = await fetch("./data.json", { cache: "no-store" });
        if (!response.ok) throw new Error(`data ${response.status}`);
        const data = await response.json();
        people = Array.isArray(data) ? data : [];
      $("resultLabel").textContent = "请输入姓名查询";
      } catch (error) {
        people = [];
        $("resultLabel").textContent = "数据加载失败，请稍后刷新";
      }
    }

    async function loadAvailable() {
      const response = await fetch(`${apiBase}/available`, {
        cache: "no-store",
        headers: { "ngrok-skip-browser-warning": "1" },
      });
      if (!response.ok) throw new Error(`available ${response.status}`);
      return response.json();
    }

    const submitUrl = "https://alidocs.dingtalk.com/notable/share/form/v01QvjnA3JeRLrK4OXo_OyTmY8y_6rrD0kS";

    const $ = (id) => document.getElementById(id);
    const results = $("results");

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function normalize(value) {
      return String(value ?? "").trim().toLowerCase();
    }

    function renderPeople(matches) {
      results.innerHTML = "";
      if (!matches.length) {
        results.innerHTML = '<div class="empty">没查到这个姓名的已认领任务。</div>';
        $("resultLabel").textContent = "未找到";
        $("taskCount").textContent = "";
        return;
      }

      let totalTasks = 0;
      for (const person of matches) {
        totalTasks += person.tasks.length;

        const personBox = document.createElement("div");
        personBox.innerHTML = `
          <div class="person">
            <span class="badge">${escapeHtml(person.code)}</span>
            <span>${escapeHtml(person.name)}</span>
          </div>
        `;
        results.appendChild(personBox);

        for (const task of person.tasks) {
          const card = document.createElement("article");
          card.className = "task";
          const statusClass = ["已审核", "已结算"].includes(task.status) ? "status ok" : "status";
          const targetBlock = task.targetUrl
            ? `
              <div class="field">
                <div class="field-label">${escapeHtml(task.targetLabel)}</div>
                <div class="copy-line">
                  <div class="field-value">${escapeHtml(task.targetTitle)}<br>${escapeHtml(task.targetUrl)}</div>
                  <button class="ghost" data-copy="${escapeHtml(task.targetUrl)}">复制链接</button>
                </div>
              </div>
            `
            : "";
          const scriptBlock = task.script
            ? `
              <div class="field">
                <div class="field-label">话术内容</div>
                <div class="copy-line">
                  <div class="field-value">${escapeHtml(task.script)}</div>
                  <button class="ghost" data-copy="${escapeHtml(task.script)}">复制话术</button>
                </div>
              </div>
            `
            : "";
          const actionBlock = task.action
            ? `
              <div class="field">
                <div class="field-label">执行说明</div>
                <div class="field-value">${escapeHtml(task.action)}</div>
              </div>
            `
            : "";

          card.innerHTML = `
            <div class="task-title">
              <div class="task-name">${escapeHtml(task.no)}</div>
              <span class="${statusClass}">${escapeHtml(task.status)}</span>
            </div>
            <div class="meta">${escapeHtml(task.type)} · 佣金 ${escapeHtml(task.commission)} 元</div>
            ${targetBlock}
            ${scriptBlock}
            ${actionBlock}
            <div class="field">
              <div class="field-label">提交入口</div>
              <div class="field-value"><a href="${escapeHtml(submitUrl)}" target="_blank" rel="noreferrer">打开任务提交表单</a></div>
            </div>
          `;
          results.appendChild(card);
        }
      }

      $("resultLabel").textContent = `找到 ${matches.length} 人`;
      $("taskCount").textContent = `共 ${totalTasks} 个任务`;
    }

    function renderAvailableTasks(tasks) {
      const container = $("claimTasks");
      $("claimActions").hidden = !tasks.length;
      if (!tasks.length) {
        container.innerHTML = '<div class="empty">当前没有可认领任务。</div>';
        return;
      }
      const groups = [
        { key: "笔记发布", title: "笔记发布", limit: 1 },
        { key: "私信用户", title: "私信", limit: 5 },
        { key: "评论截流", title: "评论", limit: 5 },
        { key: "举报", title: "举报", limit: null },
      ];
      const grouped = new Map(groups.map((group) => [group.key, []]));
      for (const task of tasks) {
        const key = task.type === "私信钓鱼举报" || task.type === "私信" ? "私信用户"
          : task.type === "笔记举报" ? "举报"
          : grouped.has(task.type) ? task.type
          : "举报";
        grouped.get(key).push(task);
      }
      container.innerHTML = `
        <div class="claim-groups">
          ${groups.map((group) => {
            const groupTasks = grouped.get(group.key);
            const count = groupTasks.length;
            const limitLabel = group.limit === null ? `${count} 个可选` : `已选 0/${group.limit}`;
            return `
              <section class="claim-group" data-group="${escapeHtml(group.key)}" data-limit="${group.limit ?? ""}">
                <div class="claim-group-head">
                  <span class="claim-group-title">${escapeHtml(group.title)}</span>
                  <span class="claim-group-count">${limitLabel}</span>
                </div>
                <div class="claim-group-list">
                  ${count ? groupTasks.map((task) => `
                    <label class="claim-task">
                      <input type="checkbox" value="${escapeHtml(task.recordId)}" data-task-type="${escapeHtml(group.key)}">
                      <span>
                        <span class="claim-task-title">${escapeHtml(task.no || "未命名任务")}</span>
                        <span class="claim-task-meta">${escapeHtml(task.type || "")}${task.targetTitle ? ` · ${escapeHtml(task.targetTitle)}` : ""}</span>
                      </span>
                    </label>
                  `).join("") : '<div class="claim-task-meta">暂无可认领任务</div>'}
                </div>
              </section>
            `;
          }).join("")}
        </div>
      `;
      updateClaimGroupStates();
    }

    function updateClaimGroupStates() {
      document.querySelectorAll(".claim-group").forEach((group) => {
        const limitText = group.dataset.limit;
        const limit = limitText ? Number(limitText) : null;
        const boxes = [...group.querySelectorAll("input[type=checkbox]")];
        const selected = boxes.filter((box) => box.checked).length;
        const count = group.querySelector(".claim-group-count");
        count.textContent = limit === null ? `${selected} 个已选` : `已选 ${selected}/${limit}`;
        boxes.forEach((box) => {
          box.disabled = Boolean(limit !== null && selected >= limit && !box.checked);
          box.closest(".claim-task")?.classList.toggle("is-disabled", box.disabled);
        });
      });
    }

    async function showAvailableTasks() {
      const name = $("claimName").value.trim();
      const message = $("claimMessage");
      message.className = "claim-message";
      message.textContent = "";
      if (!name) {
        message.className = "claim-message error";
        message.textContent = "请填写姓名";
        return;
      }
      try {
        const data = await loadAvailable();
        const matched = (data.people || []).filter((person) => person.name === name);
        if (!matched.length) throw new Error("姓名未登记，请先完成兼职登记");
        if (matched.length > 1) throw new Error("名册中存在同名兼职，请联系管理员确认");
        availableTasks = data.tasks || [];
        renderAvailableTasks(availableTasks);
        message.textContent = `当前有 ${availableTasks.length} 个可认领任务`;
      } catch (error) {
        $("claimTasks").innerHTML = "";
        $("claimActions").hidden = true;
        message.className = "claim-message error";
        message.textContent = error.message || "暂时无法加载任务";
      }
    }

    function updateClaimEntryState() {
      const hasName = Boolean($("claimName").value.trim());
      $("loadAvailableBtn").hidden = !hasName;
      if (!hasName) {
        $("claimTasks").innerHTML = "";
        $("claimActions").hidden = true;
        $("claimMessage").textContent = "";
      }
    }

    async function claimSelectedTasks() {
      const taskIds = [...document.querySelectorAll("#claimTasks input:checked")].map((input) => input.value);
      const message = $("claimMessage");
      if (!taskIds.length) {
        message.className = "claim-message error";
        message.textContent = "请至少选择一个任务";
        return;
      }
      $("claimBtn").disabled = true;
      try {
        const response = await fetch(`${apiBase}/claim`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "ngrok-skip-browser-warning": "1",
          },
          body: JSON.stringify({
            name: $("claimName").value.trim(),
            taskIds,
          }),
        });
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.error || "认领失败");
        message.className = "claim-message success";
        message.textContent = `认领成功，共 ${data.tasks.length} 个任务`;
        $("claimTasks").innerHTML = "";
        $("claimBtn").hidden = true;
        $("claimActions").hidden = false;
        await loadData();
        const q = $("claimName").value.trim();
        renderPeople(people.filter((person) => normalize(person.name) === normalize(q)));
      } catch (error) {
        message.className = "claim-message error";
        message.textContent = error.message || "认领失败，请稍后重试";
      } finally {
        $("claimBtn").disabled = false;
      }
    }

    function runQuery() {
      const q = normalize($("query").value);
      if (!q) {
        $("resultLabel").textContent = "请输入编号或姓名";
        $("taskCount").textContent = "";
        results.innerHTML = "";
        return;
      }
      const matches = people.filter((person) => normalize(person.name).includes(q));
      renderPeople(matches);
    }

    loadData();

    $("claimName").addEventListener("input", updateClaimEntryState);
    $("loadAvailableBtn").addEventListener("click", showAvailableTasks);
    $("claimBtn").addEventListener("click", claimSelectedTasks);
    $("claimTasks").addEventListener("change", updateClaimGroupStates);
    $("searchBtn").addEventListener("click", runQuery);
    $("resetBtn").addEventListener("click", () => {
      $("query").value = "";
      $("resultLabel").textContent = "等待查询";
      $("taskCount").textContent = "";
      results.innerHTML = "";
      $("query").focus();
    });
    $("query").addEventListener("keydown", (event) => {
      if (event.key === "Enter") runQuery();
    });

    results.addEventListener("click", async (event) => {
      const button = event.target.closest("[data-copy]");
      if (!button) return;
      const text = button.getAttribute("data-copy");
      try {
        await navigator.clipboard.writeText(text);
        button.textContent = "已复制";
        setTimeout(() => {
          button.textContent = button.textContent === "已复制" && text.includes("https") ? "复制链接" : "复制话术";
        }, 1200);
      } catch (error) {
        button.textContent = "复制失败";
      }
    });
  </script>
</body>
</html>
