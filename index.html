<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>兼职任务查询</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f5f7;
      --panel: #ffffff;
      --line: #dfe3e8;
      --text: #17202a;
      --muted: #667085;
      --brand: #1769e0;
      --brand-soft: #eaf2ff;
      --ok: #12805c;
      --ok-soft: #e8f6f0;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    main {
      width: min(760px, calc(100% - 28px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    .top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 700;
    }

    .subtitle {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .snapshot {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      line-height: 1.35;
      text-align: right;
    }

    .search {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 18px;
    }

    .search-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    input {
      flex: 1;
      min-width: 0;
      height: 44px;
      border: 1px solid #c9d1d9;
      border-radius: 8px;
      padding: 0 12px;
      font-size: 15px;
      color: var(--text);
      background: #fff;
      outline: none;
    }

    input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(23, 105, 224, .12);
    }

    button {
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: background .16s ease, transform .08s ease;
    }

    button:active { transform: translateY(1px); }

    .primary {
      height: 44px;
      padding: 0 18px;
      background: var(--brand);
      color: #fff;
      font-size: 15px;
    }

    .primary:hover { background: #1159c2; }

    .ghost {
      height: 34px;
      padding: 0 12px;
      background: #fff;
      color: var(--brand);
      border: 1px solid #b9cff5;
      font-size: 13px;
    }

    .ghost:hover { background: var(--brand-soft); }

    .hint {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .result-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 2px 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .person {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      height: 24px;
      border-radius: 999px;
      padding: 0 9px;
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 12px;
      font-weight: 700;
    }

    .task {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .task-title {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .task-name {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.4;
    }

    .status {
      flex: 0 0 auto;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      background: #f0f2f5;
      color: var(--muted);
    }

    .status.ok {
      background: var(--ok-soft);
      color: var(--ok);
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 10px;
    }

    .field {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 10px;
      align-items: start;
      margin-top: 10px;
      font-size: 14px;
      line-height: 1.55;
    }

    .field-label {
      color: var(--muted);
      font-size: 13px;
      padding-top: 5px;
    }

    .field-value {
      min-width: 0;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      border: 1px solid #edf0f3;
      background: #fafbfc;
      border-radius: 7px;
      padding: 9px 10px;
    }

    .copy-line {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .copy-line .field-value {
      flex: 1;
    }

    .empty {
      border: 1px dashed #c8d0d8;
      border-radius: 8px;
      background: #fafbfc;
      color: var(--muted);
      text-align: center;
      padding: 32px 16px;
      font-size: 14px;
    }

    @media (max-width: 560px) {
      main { padding-top: 22px; }
      .top { display: block; }
      .snapshot { text-align: left; margin-top: 12px; }
      .search-row { flex-wrap: wrap; }
      .primary { width: 100%; }
      .field { grid-template-columns: 1fr; gap: 3px; }
      .field-label { padding-top: 0; }
      .task-title { display: block; }
      .status { display: inline-block; margin-top: 8px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <div>
        <h1>兼职任务查询</h1>
        <p class="subtitle">输入你的兼职编号或姓名，查看已认领任务和可复制的话术、链接。</p>
      </div>
      <div class="snapshot">数据快照<br>2026-09-03</div>
    </div>

    <section class="search">
      <div class="search-row">
        <input id="query" type="search" placeholder="例如：JZ-004 或 向宇" autocomplete="off">
        <button class="primary" id="searchBtn" type="button">查询</button>
        <button class="ghost" id="resetBtn" type="button">清空</button>
      </div>
      <p class="hint">当前数据只包含已认领任务的测试快照，后续接入自动同步后会持续更新。</p>
    </section>

    <div class="result-head">
      <span id="resultLabel">等待查询</span>
      <span id="taskCount"></span>
    </div>
    <div id="results"></div>
  </main>

  <script>
    let people = [];

    async function loadData() {
      try {
        const response = await fetch("./data.json", { cache: "no-store" });
        if (!response.ok) throw new Error(`data ${response.status}`);
        const data = await response.json();
        people = Array.isArray(data) ? data : [];
        $("resultLabel").textContent = "已加载最新数据，输入编号或姓名查询";
      } catch (error) {
        people = [];
        $("resultLabel").textContent = "数据加载失败，请稍后刷新";
      }
    }

    const submitUrl = "https://alidocs.dingtalk.com/notable/share/form/v01QvjnA3JeRLrK4OXo_OyTmY8y_6rrD0kS";

    const $ = (id) => document.getElementById(id);
    const results = $("results");

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function normalize(value) {
      return String(value ?? "").trim().toLowerCase();
    }

    function renderPeople(matches) {
      results.innerHTML = "";
      if (!matches.length) {
        results.innerHTML = '<div class="empty">没查到匹配结果。检查兼职编号或姓名后重试。</div>';
        $("resultLabel").textContent = "未找到";
        $("taskCount").textContent = "";
        return;
      }

      let totalTasks = 0;
      for (const person of matches) {
        totalTasks += person.tasks.length;

        const personBox = document.createElement("div");
        personBox.innerHTML = `
          <div class="person">
            <span class="badge">${escapeHtml(person.code)}</span>
            <span>${escapeHtml(person.name)}</span>
          </div>
        `;
        results.appendChild(personBox);

        for (const task of person.tasks) {
          const card = document.createElement("article");
          card.className = "task";
          const statusClass = ["已审核", "已结算"].includes(task.status) ? "status ok" : "status";
          const targetBlock = task.targetUrl
            ? `
              <div class="field">
                <div class="field-label">${escapeHtml(task.targetLabel)}</div>
                <div class="copy-line">
                  <div class="field-value">${escapeHtml(task.targetTitle)}<br>${escapeHtml(task.targetUrl)}</div>
                  <button class="ghost" data-copy="${escapeHtml(task.targetUrl)}">复制链接</button>
                </div>
              </div>
            `
            : "";
          const scriptBlock = task.script
            ? `
              <div class="field">
                <div class="field-label">话术内容</div>
                <div class="copy-line">
                  <div class="field-value">${escapeHtml(task.script)}</div>
                  <button class="ghost" data-copy="${escapeHtml(task.script)}">复制话术</button>
                </div>
              </div>
            `
            : "";
          const actionBlock = task.action
            ? `
              <div class="field">
                <div class="field-label">执行说明</div>
                <div class="field-value">${escapeHtml(task.action)}</div>
              </div>
            `
            : "";

          card.innerHTML = `
            <div class="task-title">
              <div class="task-name">${escapeHtml(task.no)}</div>
              <span class="${statusClass}">${escapeHtml(task.status)}</span>
            </div>
            <div class="meta">${escapeHtml(task.type)} · 佣金 ${escapeHtml(task.commission)} 元</div>
            ${targetBlock}
            ${scriptBlock}
            ${actionBlock}
            <div class="field">
              <div class="field-label">提交入口</div>
              <div class="field-value"><a href="${escapeHtml(submitUrl)}" target="_blank" rel="noreferrer">打开任务提交表单</a></div>
            </div>
          `;
          results.appendChild(card);
        }
      }

      $("resultLabel").textContent = `找到 ${matches.length} 人`;
      $("taskCount").textContent = `共 ${totalTasks} 个任务`;
    }

    function runQuery() {
      const q = normalize($("query").value);
      if (!q) {
        $("resultLabel").textContent = "请输入编号或姓名";
        $("taskCount").textContent = "";
        results.innerHTML = "";
        return;
      }
      const matches = people.filter((person) =>
        normalize(person.code).includes(q) || normalize(person.name).includes(q)
      );
      renderPeople(matches);
    }

    loadData();

    $("searchBtn").addEventListener("click", runQuery);
    $("resetBtn").addEventListener("click", () => {
      $("query").value = "";
      $("resultLabel").textContent = "等待查询";
      $("taskCount").textContent = "";
      results.innerHTML = "";
      $("query").focus();
    });
    $("query").addEventListener("keydown", (event) => {
      if (event.key === "Enter") runQuery();
    });

    results.addEventListener("click", async (event) => {
      const button = event.target.closest("[data-copy]");
      if (!button) return;
      const text = button.getAttribute("data-copy");
      try {
        await navigator.clipboard.writeText(text);
        button.textContent = "已复制";
        setTimeout(() => {
          button.textContent = button.textContent === "已复制" && text.includes("https") ? "复制链接" : "复制话术";
        }, 1200);
      } catch (error) {
        button.textContent = "复制失败";
      }
    });
  </script>
</body>
</html>
